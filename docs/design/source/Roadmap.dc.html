<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Career Galaxy — Roadmap climb</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&amp;family=Roboto:wght@400;500;700&amp;family=Roboto+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.cg{--bg:#fbfaff;--bg-alt:#f3f0fb;--surface:#ffffff;--surface-2:#f6f3fd;--line:#e5dff2;--line-2:#d2c9e8;--ink:#15121f;--ink-2:#4b5466;--ink-3:#5f6878;--accent:#6d3cff;--accent-ink:#ffffff;--accent-text:#5a2be0;--accent-soft:#ede6ff;--dot:rgba(70,50,140,.12);--shadow:rgba(60,40,120,.24);--wash:rgba(255,255,255,.95);--orbit:rgba(109,60,255,.3);font-family:Roboto,system-ui,sans-serif;color:var(--ink);background:var(--bg)}
.cg[data-theme=dark]{--bg:#111019;--bg-alt:#17151f;--surface:#1e1b28;--surface-2:#262233;--line:#2e2a3d;--line-2:#433d57;--ink:#ffffff;--ink-2:#b6bdcc;--ink-3:#9aa2b3;--accent:#7a52ff;--accent-ink:#ffffff;--accent-text:#bba6ff;--accent-soft:#2b2346;--dot:rgba(220,210,255,.08);--shadow:rgba(0,0,0,.6);--wash:rgba(44,36,74,.7);--orbit:rgba(187,166,255,.32)}
.mono{font-family:'Roboto Mono',ui-monospace,monospace}
.field{position:relative;overflow:hidden;background-color:var(--bg-alt);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.4px);background-size:22px 22px}
.space{--surface:rgba(24,21,36,.92);--surface-2:#262233;--line:#2e2a3d;--line-2:rgba(190,170,255,.22);--ink:#ffffff;--ink-2:#c3c9d6;--ink-3:#a3abbb;--orbit:rgba(190,170,255,.4);--shadow:rgba(0,0,0,.65);color:#fff;position:relative;overflow:hidden;background-color:#06050d;background-image:radial-gradient(1.2px 1.2px at 20px 30px,#fff 50%,transparent 52%),radial-gradient(1px 1px at 90px 140px,#dfe4ff 50%,transparent 52%),radial-gradient(1.6px 1.6px at 150px 60px,#fff 50%,transparent 52%),radial-gradient(1px 1px at 60px 100px,#b9c2ff 50%,transparent 52%),radial-gradient(1px 1px at 40px 200px,#fff 50%,transparent 52%),radial-gradient(1.3px 1.3px at 210px 20px,#fff6d8 50%,transparent 52%),radial-gradient(1px 1px at 180px 230px,#fff 50%,transparent 52%),radial-gradient(1px 1px at 240px 160px,#cfe8ff 50%,transparent 52%),radial-gradient(55% 45% at 70% 25%,rgba(124,58,237,.32),transparent 70%),radial-gradient(45% 40% at 20% 78%,rgba(34,195,230,.2),transparent 70%),radial-gradient(35% 35% at 55% 60%,rgba(244,63,114,.14),transparent 70%);background-size:180px 180px,180px 180px,180px 180px,180px 180px,263px 263px,263px 263px,263px 263px,263px 263px,100% 100%,100% 100%,100% 100%}
.space::before{content:"";position:absolute;inset:-20%;background:radial-gradient(ellipse 50% 13% at 50% 50%,rgba(200,185,255,.2),rgba(200,185,255,.05) 55%,transparent 75%);rotate:-16deg;pointer-events:none}
.twinkle{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(2px 2px at 12% 22%,#fff 50%,transparent 55%),radial-gradient(2px 2px at 68% 12%,#fff 50%,transparent 55%),radial-gradient(2.4px 2.4px at 88% 64%,#fff 50%,transparent 55%),radial-gradient(1.8px 1.8px at 32% 82%,#fff 50%,transparent 55%),radial-gradient(2px 2px at 52% 38%,#e9e2ff 50%,transparent 55%);animation:tw 3.2s ease-in-out infinite alternate}
@keyframes tw{0%{opacity:.25}100%{opacity:1}}
@media (prefers-reduced-motion: reduce){.twinkle{animation:none}}
.climber{position:absolute;transform:translate(-50%,calc(-100% - 30px));z-index:9;pointer-events:none;transition:left .8s cubic-bezier(.2,.8,.2,1),top .8s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 10px 10px rgba(0,0,0,.45))}
.t-violet{--c1:#dccbff;--c2:#8b5cf6;--c3:#4c1fc0}.t-gold{--c1:#fff1bd;--c2:#f5b301;--c3:#a86400}.t-green{--c1:#c9f7d8;--c2:#22c55e;--c3:#11713a}.t-pearl{--c1:#ffffff;--c2:#e9e4f7;--c3:#a59cc7}.t-mute{--c1:#e7e4f0;--c2:#b8b2cc;--c3:#7d7695}
.sphere{display:block;border-radius:50%;background:radial-gradient(circle at 33% 27%,rgba(255,255,255,.95) 0,rgba(255,255,255,.95) 3%,rgba(255,255,255,.25) 11%,rgba(255,255,255,0) 22%),radial-gradient(circle at 42% 36%,var(--c1) 0,var(--c2) 48%,var(--c3) 100%)}
.gem{display:block;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);background:conic-gradient(from -45deg at 50% 50%,var(--c1) 0 25%,var(--c2) 0 50%,var(--c3) 0 75%,var(--c2) 0)}
.ibtn{min-height:42px;min-width:42px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font:500 14px Outfit,sans-serif;padding:0 14px;cursor:pointer}
.stage{position:absolute;transform:translate(-50%,-50%);border:0;padding:0;background:transparent;cursor:pointer;filter:drop-shadow(0 12px 10px var(--shadow))}
.stage .gem{transition:scale .3s cubic-bezier(.3,1.6,.5,1)}.stage:hover .gem{scale:1.15}
.stage:focus-visible,.step:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
.slabel{position:absolute;left:calc(100% + 10px);top:50%;translate:0 -50%;white-space:nowrap;font:500 14px/1 Outfit,sans-serif;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);padding:7px 11px;border-radius:999px}
.stage.cur .slabel{color:var(--ink);border-color:var(--accent);font-weight:700}
.sat{position:absolute;transform:translate(-50%,-50%);pointer-events:none;filter:drop-shadow(0 6px 6px var(--shadow))}
.satl{position:absolute;left:50%;top:calc(100% + 4px);translate:-50% 0;white-space:nowrap;font:500 12px/1 Outfit,sans-serif;color:var(--ink);background:var(--surface);border:1px solid var(--line);padding:4px 8px;border-radius:999px}
.step{width:34px;height:34px;border-radius:50%;border:0;font:600 13px Outfit,sans-serif;cursor:pointer}
.ck{display:flex;align-items:center;gap:12px;min-height:40px;font:400 15px Roboto,sans-serif;color:var(--ink);border-top:1px solid var(--line);cursor:pointer}
.ck input{width:20px;height:20px;accent-color:#22a55a;margin:0}
.cat{font:500 12px 'Roboto Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.res{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:14px;font:500 14px Outfit,sans-serif;color:var(--ink)}
</style>
</helmet>
<div class="cg" data-theme="{{theme}}" style="height: 900px; display: flex; flex-direction: column">

<header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding: 14px 24px; border-bottom: 1px solid var(--line)">
<a class="ibtn" href="Galaxy.dc.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>Galaxy</a>
<span class="mono" style="font-size: 13px; color: var(--ink-3)">/ AI / ML /</span>
<span style="display: flex; align-items: center; gap: 10px; font: 800 24px/1 Outfit, sans-serif; letter-spacing: -.03em"><span class="sphere t-violet" style="width: 26px; height: 26px" aria-hidden="true"></span>Gen AI Engineer</span>
<div style="display: flex; align-items: center; gap: 10px; flex: 0 1 300px; margin-left: 16px">
<div style="flex: 1; height: 10px; border-radius: 5px; background: var(--line)"><div style="height: 10px; border-radius: 5px; background: #8b5cf6; width: {{pct}}%"></div></div>
<span style="font: 700 16px Outfit, sans-serif">{{pct}}%</span><span class="mono" style="font-size: 12px; color: var(--ink-3)">{{doneCount}} / {{totalCount}}</span>
</div>
<div style="flex: 1 1 0"></div>
<button type="button" class="ibtn"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4v16l13-8z"></path></svg>Guided tour</button>
<a class="ibtn" href="Recall.dc.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M7 7h11l-3-3M17 17H6l3 3"></path></svg>Pivot</a>
<button type="button" class="ibtn" onClick="{{toggleTheme}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>{{themeLabel}}</button>
</header>

<div style="flex: 1; min-height: 0; display: flex; overflow: hidden">
<main class="space" style="flex: 1 1 auto; min-width: 0; position: relative">
<div class="twinkle" aria-hidden="true"></div>
<svg width="100%" height="100%" viewBox="0 0 800 780" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; inset: 0">
<ellipse cx="400" cy="710" rx="300" ry="50" fill="none" stroke="var(--orbit)" stroke-dasharray="3 6"></ellipse>
<path d="M170 690 C 300 740, 470 740, 560 700 C 660 655, 720 600, 680 560 C 630 510, 420 520, 300 495 C 170 470, 110 410, 150 360 C 190 310, 400 300, 520 280 C 640 260, 700 190, 640 120" fill="none" stroke="var(--line-2)" stroke-width="18" stroke-linecap="round"></path>
<path d="M170 690 C 300 740, 470 740, 560 700 C 660 655, 720 600, 680 560 C 630 510, 420 520, 300 495 C 170 470, 110 410, 150 360 C 190 310, 400 300, 520 280 C 640 260, 700 190, 640 120" fill="none" stroke="#8b5cf6" stroke-width="9" stroke-linecap="round" pathLength="6" stroke-dasharray="{{progressDash}}"></path>
</svg>
<sc-if value="{{showOrbit}}" hint-placeholder-val="{{ true }}"><div aria-hidden="true" style="{{orbitStyle}}"></div></sc-if>
<sc-for list="{{stages}}" as="st" hint-placeholder-count="7">
<button type="button" class="{{st.cls}}" style="{{st.style}}" onClick="{{st.go}}" aria-label="{{st.aria}}"><span class="gem {{st.tint}}" style="{{st.gemStyle}}"></span><span class="slabel" style="{{st.labelStyle}}">{{st.label}}</span></button>
</sc-for>
<sc-for list="{{sats}}" as="t" hint-placeholder-count="6">
<span class="sat" style="{{t.style}}"><span class="sphere {{t.tint}}" style="width: 100%; height: 100%"></span><span class="satl">{{t.name}}</span></span>
</sc-for>
<div class="climber" style="{{climberStyle}}" aria-hidden="true">
<svg width="72" height="130" viewBox="0 0 60 110">
<defs>
<radialGradient id="skin" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ffe3cc"></stop><stop offset=".55" stop-color="#f0b38e"></stop><stop offset="1" stop-color="#b8714c"></stop></radialGradient>
<linearGradient id="hood" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c4adff"></stop><stop offset=".5" stop-color="#7c4dff"></stop><stop offset="1" stop-color="#3d1ca6"></stop></linearGradient>
<linearGradient id="pant" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5a6a8f"></stop><stop offset="1" stop-color="#1f2840"></stop></linearGradient>
<linearGradient id="pack" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd18a"></stop><stop offset="1" stop-color="#c26a05"></stop></linearGradient>
</defs>
<ellipse cx="30" cy="106" rx="16" ry="3.2" fill="rgba(0,0,0,.35)"></ellipse>
<line x1="49" y1="4" x2="47" y2="44" stroke="#e5e1f0" stroke-width="1.6" stroke-linecap="round"></line>
<path d="M49 4 L60 8 L48.6 13 Z" fill="#ffd166"></path>
<rect x="12" y="38" width="12" height="24" rx="5" fill="url(#pack)"></rect>
<rect x="21" y="66" width="8" height="36" rx="4" fill="url(#pant)"></rect>
<rect x="31" y="66" width="8" height="36" rx="4" fill="url(#pant)"></rect>
<ellipse cx="24" cy="103" rx="7" ry="3.6" fill="#f4f1ff"></ellipse>
<ellipse cx="37" cy="103" rx="7" ry="3.6" fill="#f4f1ff"></ellipse>
<rect x="17" y="35" width="26" height="35" rx="11" fill="url(#hood)"></rect>
<rect x="11" y="40" width="7" height="26" rx="3.5" fill="url(#hood)" transform="rotate(10 14 40)"></rect>
<rect x="40" y="22" width="7" height="24" rx="3.5" fill="url(#hood)" transform="rotate(12 43 46)"></rect>
<circle cx="47" cy="23" r="3.6" fill="url(#skin)"></circle>
<circle cx="30" cy="22" r="12" fill="url(#skin)"></circle>
<path d="M18 21 a12 12 0 0 1 24 0 q-5 -5 -12 -4 q-7 1 -12 4z" fill="#2b1d16"></path>
<circle cx="26" cy="24" r="1.3" fill="#2b1d16"></circle>
<circle cx="34" cy="24" r="1.3" fill="#2b1d16"></circle>
<path d="M26.5 28.5 q3.5 2.6 7 0" stroke="#7a3b22" stroke-width="1.2" fill="none" stroke-linecap="round"></path>
<ellipse cx="25" cy="16" rx="4" ry="2.2" fill="rgba(255,255,255,.35)"></ellipse>
<ellipse cx="24" cy="44" rx="3" ry="6" fill="rgba(255,255,255,.22)"></ellipse>
</svg>
</div>
<nav aria-label="Stages" style="position: absolute; left: 50%; bottom: 18px; translate: -50% 0; display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line-2); box-shadow: 0 12px 30px -16px var(--shadow)">
<sc-for list="{{steps}}" as="sp" hint-placeholder-count="7"><button type="button" class="step" style="{{sp.style}}" onClick="{{sp.go}}" aria-label="{{sp.aria}}">{{sp.n}}</button></sc-for>
</nav>
<div style="position: absolute; left: 16px; top: 16px; display: flex; gap: 14px; flex-wrap: wrap; padding: 10px 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); font: 400 13px Roboto, sans-serif; color: var(--ink-2)">
<span style="display: flex; align-items: center; gap: 6px"><span class="gem t-gold" style="width: 12px; height: 14px"></span>stage done</span>
<span style="display: flex; align-items: center; gap: 6px"><span class="sphere t-green" style="width: 11px; height: 11px"></span>topic learned</span>
<span style="display: flex; align-items: center; gap: 6px"><span class="sphere t-pearl" style="width: 11px; height: 11px"></span>to learn</span>
</div>
</main>

<aside aria-label="Stage details" style="flex: 0 0 400px; padding: 22px 24px; box-sizing: border-box; border-left: 1px solid var(--line); background: var(--bg); overflow: hidden">
<div style="display: flex; justify-content: space-between" class="cat"><span>{{stageOf}}</span><span>{{stageDuration}}</span></div>
<h2 style="font: 800 32px/1.05 Outfit, sans-serif; letter-spacing: -.03em; margin: 12px 0 0">{{stageTitle}}</h2>
<p style="margin: 8px 0 14px; font: 400 15px/1.55 Roboto, sans-serif; color: var(--ink-2)">{{stageGoal}}</p>
<div class="cat" style="margin-bottom: 4px">Learn · tick to light up</div>
<sc-for list="{{topics}}" as="t" hint-placeholder-count="6">
<label class="ck"><input type="checkbox" checked="{{t.done}}" onChange="{{t.toggle}}">{{t.name}}</label>
</sc-for>
<div class="cat" style="margin: 16px 0 8px">Resources</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<a class="res" href="https://huggingface.co/learn">Hugging Face Learn<span class="mono" style="margin-left: auto; font-size: 11px; color: var(--ink-3)">COURSE</span></a>
<a class="res" href="https://docs.claude.com">Claude docs<span class="mono" style="margin-left: auto; font-size: 11px; color: var(--ink-3)">DOCS</span></a>
</div>
<div style="margin-top: 14px; padding: 14px 16px; border-radius: 16px; background: var(--surface-2)"><div class="cat">Build</div><div style="font: 600 16px/1.35 Outfit, sans-serif; margin-top: 6px">{{stageProject}}</div></div>
<div style="display: flex; gap: 10px; margin-top: 14px">
<a class="ibtn" href="Recall.dc.html" style="flex: 1; min-height: 48px">Self-check</a>
<button type="button" onClick="{{next}}" style="flex: 1; min-height: 48px; border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font: 600 15px Outfit, sans-serif; cursor: pointer; box-shadow: 0 14px 30px -14px var(--accent)">Next stage →</button>
</div>
</aside>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  S() {
    return [
      ['Foundations', '3–4 weeks', 'Write clean Python, use Git and call web APIs.', ['Python', 'Git & GitHub', 'HTTP & APIs', 'JSON', 'Linux & Bash'], 'A CLI tool that calls a public API'],
      ['How LLMs work', '2–3 weeks', 'Explain tokens, context windows and sampling.', ['Tokens & context', 'Transformers', 'Embeddings', 'Sampling', 'Hallucinations'], 'Compare three models on 20 prompts'],
      ['Prompting & APIs', '3–4 weeks', 'Build reliable LLM calls with structured output.', ['Prompt engineering', 'Structured output', 'Streaming', 'Tool use', 'Retries'], 'A ticket triager returning valid JSON'],
      ['RAG & retrieval', '4–6 weeks', 'Ground answers in your own documents, with sources users can check.', ['Embeddings', 'Vector databases', 'Chunking', 'Hybrid search', 'Reranking', 'RAG evaluation'], 'Chat with your PDFs, with page citations'],
      ['Fine-tuning', '3–5 weeks', 'Know when to fine-tune, and adapt an open model.', ['PyTorch', 'LoRA / PEFT', 'Dataset curation', 'Quantization', 'Local inference'], 'LoRA-tune a small model for one task'],
      ['Agents & tools', '4–5 weeks', 'Build agents that plan, call tools and recover.', ['Agent loops', 'Tool design', 'MCP', 'Memory', 'Guardrails'], 'A research agent that writes a cited brief'],
      ['Production & evals', '4–6 weeks', 'Ship LLM features that are measured and safe.', ['LLM evaluation', 'Observability', 'Cost control', 'Prompt injection', 'CI/CD'], 'Deploy with evals in CI and tracing']
    ];
  }
  renderVals() {
    const s = this.state || {};
    const S = this.S();
    const theme = s.theme || this.props.theme || 'light';
    const cur = s.stage == null ? 3 : s.stage;
    const done = s.done || S.map((st, i) => st[3].map((t, k) => i < 3 || (i === 3 && k < 2)));
    const pts = [[170, 690], [560, 700], [680, 560], [300, 495], [150, 360], [520, 280], [640, 120]];
    const stageDone = (i) => done[i].every(Boolean);
    let doneCount = 0, total = 0;
    done.forEach((a) => a.forEach((d) => { total++; if (d) doneCount++; }));
    const P = (i) => [pts[i][0] / 8, pts[i][1] / 7.8];
    const stages = S.map((st, i) => ({
      cls: i === cur ? 'stage cur' : 'stage', label: (i + 1) + ' · ' + st[0], aria: 'Stage ' + (i + 1) + ': ' + st[0],
      tint: stageDone(i) ? 't-gold' : i === cur ? 't-violet' : 't-mute',
      gemStyle: i === cur ? 'width:60px;height:72px' : 'width:38px;height:46px',
      labelStyle: i === cur ? 'left:auto;right:calc(100% + 165px);font-size:16px;padding:9px 14px' : pts[i][0] > 500 ? 'left:auto;right:calc(100% + 10px)' : '',
      style: 'left:' + P(i)[0].toFixed(2) + '%;top:' + P(i)[1].toFixed(2) + '%;z-index:' + (i === cur ? 6 : 3),
      go: () => this.setState({ stage: i, done: done })
    }));
    const c = P(cur);
    const topics = S[cur][3];
    const sats = topics.map((t, k) => {
      const a = -Math.PI / 2 + ((k + 0.5) / topics.length) * Math.PI * 2;
      return { name: t, tint: done[cur][k] ? 't-green' : 't-pearl', style: 'left:calc(' + c[0].toFixed(2) + '% + ' + (Math.cos(a) * 150).toFixed(1) + 'px);top:calc(' + c[1].toFixed(2) + '% + ' + (Math.sin(a) * 78).toFixed(1) + 'px);width:22px;height:22px;z-index:' + (Math.sin(a) > 0 ? 8 : 2) };
    });
    const setDone = (k) => { const nd = done.map((a) => a.slice()); nd[cur][k] = !nd[cur][k]; this.setState({ done: nd }); };
    return {
      theme: theme, themeLabel: theme === 'dark' ? 'Light' : 'Dark',
      toggleTheme: () => this.setState({ theme: theme === 'dark' ? 'light' : 'dark' }),
      pct: Math.round((doneCount / total) * 100), doneCount: doneCount, totalCount: total,
      progressDash: (cur + 0.001) + ' 100',
      stages: stages, sats: sats, showOrbit: true,
      climberStyle: 'left:' + c[0].toFixed(2) + '%;top:' + c[1].toFixed(2) + '%',
      orbitStyle: 'position:absolute;left:calc(' + c[0].toFixed(2) + '% - 150px);top:calc(' + c[1].toFixed(2) + '% - 78px);width:300px;height:156px;border-radius:50%;border:1.5px dashed var(--orbit);z-index:1',
      steps: S.map((st, i) => ({ n: i + 1, aria: 'Go to stage ' + (i + 1), style: stageDone(i) ? 'background:#f5b301;color:#2a1d00' : i === cur ? 'background:#7a52ff;color:#fff;box-shadow:0 0 0 3px var(--surface),0 0 0 5px #7a52ff' : 'background:var(--line);color:var(--ink-2)', go: () => this.setState({ stage: i, done: done }) })),
      stageOf: 'Stage ' + (cur + 1) + ' of ' + S.length, stageTitle: S[cur][0], stageDuration: S[cur][1], stageGoal: S[cur][2], stageProject: S[cur][4],
      topics: topics.map((t, k) => ({ name: t, done: done[cur][k], toggle: () => setDone(k) })),
      next: () => this.setState({ stage: Math.min(S.length - 1, cur + 1), done: done })
    };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Career Galaxy — Explorer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&amp;family=Roboto:wght@400;500;700&amp;family=Roboto+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.cg{--bg:#fbfaff;--bg-alt:#f3f0fb;--surface:#ffffff;--surface-2:#f6f3fd;--line:#e5dff2;--line-2:#d2c9e8;--ink:#15121f;--ink-2:#4b5466;--ink-3:#5f6878;--accent:#6d3cff;--accent-ink:#ffffff;--accent-text:#5a2be0;--accent-soft:#ede6ff;--dot:rgba(70,50,140,.12);--shadow:rgba(60,40,120,.24);--wash:rgba(255,255,255,.95);--orbit:rgba(109,60,255,.28);font-family:Roboto,system-ui,sans-serif;color:var(--ink);background:var(--bg)}
.cg[data-theme=dark]{--bg:#111019;--bg-alt:#17151f;--surface:#1e1b28;--surface-2:#262233;--line:#2e2a3d;--line-2:#433d57;--ink:#ffffff;--ink-2:#b6bdcc;--ink-3:#9aa2b3;--accent:#7a52ff;--accent-ink:#ffffff;--accent-text:#bba6ff;--accent-soft:#2b2346;--dot:rgba(220,210,255,.08);--shadow:rgba(0,0,0,.6);--wash:rgba(44,36,74,.7);--orbit:rgba(187,166,255,.3)}
.mono{font-family:'Roboto Mono',ui-monospace,monospace}
.field{position:relative;overflow:hidden;background-color:var(--bg-alt);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.4px);background-size:22px 22px}
.space{--surface:rgba(24,21,36,.92);--surface-2:#262233;--line:#2e2a3d;--line-2:#4a4362;--ink:#ffffff;--ink-2:#c3c9d6;--ink-3:#a3abbb;--orbit:rgba(190,170,255,.35);--shadow:rgba(0,0,0,.65);color:#fff;position:relative;overflow:hidden;background-color:#06050d;background-image:radial-gradient(1.2px 1.2px at 20px 30px,#fff 50%,transparent 52%),radial-gradient(1px 1px at 90px 140px,#dfe4ff 50%,transparent 52%),radial-gradient(1.6px 1.6px at 150px 60px,#fff 50%,transparent 52%),radial-gradient(1px 1px at 60px 100px,#b9c2ff 50%,transparent 52%),radial-gradient(1px 1px at 40px 200px,#fff 50%,transparent 52%),radial-gradient(1.3px 1.3px at 210px 20px,#fff6d8 50%,transparent 52%),radial-gradient(1px 1px at 180px 230px,#fff 50%,transparent 52%),radial-gradient(1px 1px at 240px 160px,#cfe8ff 50%,transparent 52%),radial-gradient(55% 45% at 70% 25%,rgba(124,58,237,.32),transparent 70%),radial-gradient(45% 40% at 20% 78%,rgba(34,195,230,.2),transparent 70%),radial-gradient(35% 35% at 55% 60%,rgba(244,63,114,.14),transparent 70%);background-size:180px 180px,180px 180px,180px 180px,180px 180px,263px 263px,263px 263px,263px 263px,263px 263px,100% 100%,100% 100%,100% 100%}
.space::before{content:"";position:absolute;inset:-20%;background:radial-gradient(ellipse 50% 13% at 50% 50%,rgba(200,185,255,.2),rgba(200,185,255,.05) 55%,transparent 75%);rotate:-16deg;pointer-events:none}
.twinkle{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(2px 2px at 12% 22%,#fff 50%,transparent 55%),radial-gradient(2px 2px at 68% 12%,#fff 50%,transparent 55%),radial-gradient(2.4px 2.4px at 88% 64%,#fff 50%,transparent 55%),radial-gradient(1.8px 1.8px at 32% 82%,#fff 50%,transparent 55%),radial-gradient(2px 2px at 52% 38%,#e9e2ff 50%,transparent 55%);animation:tw 3.2s ease-in-out infinite alternate}
@keyframes tw{0%{opacity:.25}100%{opacity:1}}
@media (prefers-reduced-motion: reduce){.twinkle{animation:none}}
.t-violet{--c1:#dccbff;--c2:#8b5cf6;--c3:#4c1fc0}.t-cyan{--c1:#c8f7ff;--c2:#22c3e6;--c3:#0a6f93}.t-gold{--c1:#fff1bd;--c2:#f5b301;--c3:#a86400}.t-pink{--c1:#ffc4d7;--c2:#f43f72;--c3:#a50f3a}.t-teal{--c1:#c8f8ef;--c2:#14b8a6;--c3:#076b60}.t-blue{--c1:#d0e1ff;--c2:#3b82f6;--c3:#1846b8}.t-orange{--c1:#ffe2bb;--c2:#f59e0b;--c3:#a84a05}.t-pearl{--c1:#ffffff;--c2:#e9e4f7;--c3:#a59cc7}
.sphere{display:block;border-radius:50%;background:radial-gradient(circle at 33% 27%,rgba(255,255,255,.95) 0,rgba(255,255,255,.95) 3%,rgba(255,255,255,.25) 11%,rgba(255,255,255,0) 22%),radial-gradient(circle at 42% 36%,var(--c1) 0,var(--c2) 48%,var(--c3) 100%)}
.ibtn{min-height:42px;min-width:42px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font:500 14px Outfit,sans-serif;padding:0 14px;cursor:pointer}
.lab{font:500 12px 'Roboto Mono',monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);margin:22px 4px 10px}
.dbtn{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:0 12px;border-radius:14px;border:1px solid transparent;background:transparent;color:var(--ink);font:500 15px Outfit,sans-serif;text-align:left;cursor:pointer;box-sizing:border-box}
.dbtn.on{background:var(--surface);border-color:var(--line-2);box-shadow:0 8px 20px -14px var(--shadow)}
.dbtn .n{margin-left:auto;font:500 12px 'Roboto Mono',monospace;color:var(--ink-3)}
.planet{position:absolute;transform:translate(-50%,-50%);border:0;padding:0;background:transparent;cursor:pointer;border-radius:50%;filter:drop-shadow(0 16px 14px var(--shadow));transition:width .5s,height .5s}
.planet:focus-visible,.rbtn:focus-visible,.dbtn:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
.plabel{position:absolute;left:50%;top:calc(100% + 10px);translate:-50% 0;white-space:nowrap;font:600 14px/1 Outfit,sans-serif;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);padding:6px 11px;border-radius:999px}
.moon{position:absolute;transform:translate(-50%,-50%);pointer-events:none}
.mlabel{position:absolute;left:calc(100% + 6px);top:50%;translate:0 -50%;white-space:nowrap;font:500 12px/1 Outfit,sans-serif;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);padding:4px 8px;border-radius:999px}
.rbtn{display:flex;align-items:center;gap:12px;width:100%;min-height:40px;padding:0 12px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 15px Outfit,sans-serif;text-align:left;cursor:pointer;box-sizing:border-box}
.rbtn.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.stg{display:flex;align-items:center;gap:10px;font:400 14px Roboto,sans-serif;color:var(--ink-2);min-height:30px}
</style>
</helmet>
<div class="cg" data-theme="{{theme}}" style="height: 900px; display: flex; flex-direction: column">

<header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; padding: 14px 24px; border-bottom: 1px solid var(--line)">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; font: 800 21px/1 Outfit, sans-serif; letter-spacing: -.03em"><span class="sphere t-violet" style="width: 28px; height: 28px" aria-hidden="true"></span>Career Galaxy</a>
<label style="flex: 0 1 420px; display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 16px; margin-left: 20px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink-3)">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
<span style="position: absolute; left: -9999px">Search</span><input type="search" placeholder="Search roles, skills or tools" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--ink); font: 400 15px Roboto, sans-serif"><kbd class="mono" style="font-size: 11px; border: 1px solid var(--line-2); border-radius: 6px; padding: 2px 6px">⌘K</kbd></label>
<div style="flex: 1 1 0"></div>
<label style="display: flex; align-items: center; gap: 10px; font: 500 14px Outfit, sans-serif; color: var(--ink-2)">I already am<select style="min-height: 42px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); font: 500 14px Outfit, sans-serif; padding: 0 12px"><option>Backend Developer</option><option>Not set</option></select></label>
<button type="button" class="ibtn" onClick="{{toggleTheme}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>{{themeLabel}}</button>
</header>

<div style="flex: 1; min-height: 0; display: flex; overflow: hidden">
<aside aria-label="Domains" style="flex: 1 1 240px; max-width: 260px; padding: 8px 16px 16px; box-sizing: border-box; border-right: 1px solid var(--line)">
<p class="lab">Domains</p>
<sc-for list="{{domains}}" as="d" hint-placeholder-count="7">
<button type="button" class="{{d.cls}}" onClick="{{d.go}}"><span class="sphere {{d.tint}}" style="width: 18px; height: 18px"></span>{{d.name}}<span class="n">{{d.count}}</span></button>
</sc-for>
<p class="lab">Your climbs</p>
<div class="dbtn" style="cursor: default"><svg width="22" height="22" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="15" fill="none" stroke="var(--line-2)" stroke-width="5"></circle><circle cx="18" cy="18" r="15" fill="none" stroke="#8b5cf6" stroke-width="5" stroke-dasharray="36 94" transform="rotate(-90 18 18)"></circle></svg>Gen AI Engineer<span class="n">38%</span></div>
<div class="dbtn" style="cursor: default"><svg width="22" height="22" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="15" fill="none" stroke="var(--line-2)" stroke-width="5"></circle><circle cx="18" cy="18" r="15" fill="none" stroke="#14b8a6" stroke-width="5" stroke-dasharray="11 94" transform="rotate(-90 18 18)"></circle></svg>Data Scientist<span class="n">12%</span></div>
</aside>

<main class="space" style="flex: 999 1 520px; min-width: 0; position: relative">
<div class="twinkle" aria-hidden="true"></div>
<svg width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; inset: 0">
<ellipse cx="50" cy="50" rx="38" ry="37" fill="none" stroke="var(--orbit)" stroke-width=".25" stroke-dasharray="1 1.2"></ellipse>
<sc-for list="{{links}}" as="l" hint-placeholder-count="3"><line x1="{{l.x1}}" y1="{{l.y1}}" x2="{{l.x2}}" y2="{{l.y2}}" stroke="#c4b0ff" stroke-opacity=".7" stroke-width="1.5" vector-effect="non-scaling-stroke"></line></sc-for>
</svg>
<sc-for list="{{moons}}" as="m" hint-placeholder-count="39">
<span class="moon" style="{{m.style}}"><span class="sphere {{m.tint}}" style="width: 100%; height: 100%"></span><sc-if value="{{m.labeled}}" hint-placeholder-val="{{ false }}"><span class="mlabel" style="{{m.labelStyle}}">{{m.title}}</span></sc-if></span>
</sc-for>
<sc-for list="{{planets}}" as="p" hint-placeholder-count="7">
<button type="button" class="planet" style="{{p.style}}" onClick="{{p.go}}" aria-label="{{p.aria}}"><span class="sphere {{p.tint}}" style="width: 100%; height: 100%"></span><span class="plabel">{{p.name}}</span></button>
</sc-for>
<div style="position: absolute; left: 16px; bottom: 16px; display: flex; gap: 14px; flex-wrap: wrap; padding: 10px 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); font: 400 13px Roboto, sans-serif; color: var(--ink-2)">
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 18px; height: 2px; background: #8b5cf6"></span>shared skills</span>
<span style="display: flex; align-items: center; gap: 6px"><span class="sphere t-pearl" style="width: 10px; height: 10px"></span>role moon</span>
<span>planet size = number of roles</span>
</div>
<div style="position: absolute; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px">
<button type="button" class="ibtn" aria-label="Zoom in" style="padding: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
<button type="button" class="ibtn" aria-label="Zoom out" style="padding: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
<button type="button" class="ibtn" aria-label="Reset view" style="padding: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"></path></svg></button>
</div>
<p class="mono" style="position: absolute; left: 50%; top: 16px; translate: -50% 0; margin: 0; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3)">drag to orbit · click a planet · pick a role</p>
</main>

<aside aria-label="Details" style="flex: 1 1 320px; max-width: 360px; padding: 22px; box-sizing: border-box; border-left: 1px solid var(--line); overflow: hidden">
<div style="display: flex; align-items: center; gap: 14px"><span class="sphere {{domTint}}" style="width: 52px; height: 52px; filter: drop-shadow(0 10px 8px var(--shadow))" aria-hidden="true"></span><div><div class="mono" style="font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3)">Domain</div><div style="font: 700 24px/1.1 Outfit, sans-serif; letter-spacing: -.02em">{{domName}}</div></div></div>
<div style="display: flex; flex-direction: column; gap: 6px; margin-top: 16px">
<sc-for list="{{roles}}" as="r" hint-placeholder-count="5">
<button type="button" class="{{r.cls}}" onClick="{{r.go}}"><span class="sphere {{r.tint}}" style="width: 14px; height: 14px"></span>{{r.title}}</button>
</sc-for>
</div>
<div style="margin-top: 14px; padding: 16px; border-radius: 18px; background: var(--surface-2)">
<div style="font: 700 22px/1.15 Outfit, sans-serif; letter-spacing: -.02em">{{roleTitle}}</div>
<p style="margin: 6px 0 12px; font: 400 14px/1.5 Roboto, sans-serif; color: var(--ink-2)">{{roleSummary}}</p>
<div class="stg"><span class="sphere t-gold" style="width: 12px; height: 12px"></span>2 stages done<span class="sphere t-violet" style="width: 12px; height: 12px; margin-left: 10px"></span>1 in progress</div>
<a href="Roadmap.dc.html" style="margin-top: 14px; display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 48px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font: 600 16px Outfit, sans-serif; box-shadow: 0 14px 30px -14px var(--accent)">Fly in and climb<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
</div>
</aside>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  data() {
    return [
      { id: 'ai', name: 'AI / ML', tint: 't-violet', rel: [1, 2, 4], roles: [['Gen AI Engineer', 'Builds products on LLMs: prompting, RAG, fine-tuning and evals.'], ['AI Agent Engineer', 'Builds agents that plan, call tools and act, safely.'], ['ML Engineer', 'Trains, evaluates and ships machine learning models.'], ['MLOps Engineer', 'Builds platforms that deploy and monitor models.'], ['AI Research Scientist', 'Invents and tests new models and training methods.'], ['Computer Vision Engineer', 'Teaches machines to understand images and video.'], ['NLP Engineer', 'Builds systems that read and generate language.'], ['AI Red Teaming', 'Finds how AI systems fail or can be misused.']] },
      { id: 'data', name: 'Data', tint: 't-teal', rel: [0, 2], roles: [['Data Scientist', 'Uses statistics and ML to explain, predict and experiment.'], ['Data Engineer', 'Builds pipelines and warehouses that move data reliably.'], ['Data Analyst', 'Turns raw data into answers and dashboards.'], ['BI Analyst', 'Builds the metrics and reporting a business runs on.'], ['Database Engineer', 'Designs, tunes and protects databases.']] },
      { id: 'software', name: 'Software', tint: 't-blue', rel: [0, 4, 3], roles: [['Frontend Developer', 'Builds the interfaces people use in the browser.'], ['Backend Developer', 'Builds the APIs, databases and services behind apps.'], ['Full Stack Developer', 'Ships whole features, from database to button.'], ['Mobile Developer', 'Builds iOS and Android apps.'], ['Game Developer', 'Builds games with Unity, Unreal or Godot.'], ['Embedded & IoT', 'Writes software for devices and microcontrollers.'], ['QA / SDET', 'Designs test strategy and automation.'], ['Software Architect', 'Shapes how large systems fit together.']] },
      { id: 'security', name: 'Security', tint: 't-pink', rel: [4, 2], roles: [['SOC Analyst', 'Detects and responds to security incidents.'], ['Penetration Tester', 'Breaks in, with permission, to find weaknesses first.'], ['DevSecOps', 'Builds security into pipelines, cloud and code.']] },
      { id: 'infra', name: 'Infrastructure', tint: 't-orange', rel: [2, 3, 0], roles: [['DevOps Engineer', 'Automates build, test, release and infrastructure.'], ['Site Reliability Engineer', 'Keeps production fast and available with SLOs.'], ['Cloud Engineer', 'Designs and runs systems on the cloud.'], ['Platform Engineer', 'Builds the internal platform engineers ship on.'], ['Network Engineer', 'Designs and secures networks.']] },
      { id: 'product', name: 'Product & Design', tint: 't-gold', rel: [2], roles: [['UX / UI Designer', 'Researches users and designs clear products.'], ['Product Manager', 'Decides what to build and why.'], ['Engineering Manager', 'Grows engineers and teams that deliver.'], ['Technical Writer', 'Writes the docs developers learn from.'], ['Developer Relations', 'Helps developers succeed with a product.']] },
      { id: 'frontier', name: 'Frontier', tint: 't-cyan', rel: [0, 2], roles: [['Blockchain Developer', 'Builds smart contracts and decentralised apps.'], ['AR / VR Developer', 'Builds immersive experiences.'], ['Quantum Engineer', 'Writes algorithms for quantum hardware.'], ['Robotics Engineer', 'Builds robots that sense, plan and move.'], ['Forward Deployed Engineer', 'Builds and deploys AI solutions with customers.']] }
    ];
  }
  renderVals() {
    const s = this.state || {};
    const D = this.data();
    const theme = s.theme || this.props.theme || 'light';
    const di = s.domain == null ? 0 : s.domain;
    const ri = s.role == null ? 0 : s.role;
    let slot = 0;
    const pos = D.map((d, i) => { if (i === di) return [50, 50]; const a = -Math.PI / 2 + (slot++ / (D.length - 1)) * Math.PI * 2; return [50 + 38 * Math.cos(a), 50 + 37 * Math.sin(a)]; });
    const planets = D.map((d, i) => {
      const size = (i === di ? 26 : 16) + d.roles.length * 4;
      return { name: d.name, tint: d.tint, aria: 'Show ' + d.name + ' roles', style: 'left:' + pos[i][0].toFixed(2) + '%;top:' + pos[i][1].toFixed(2) + '%;width:' + size + 'px;height:' + size + 'px;z-index:' + (i === di ? 6 : 4) + (i === di ? ';outline:2px solid var(--accent);outline-offset:8px' : ''), go: () => this.setState({ domain: i, role: 0 }) };
    });
    const moons = [];
    D.forEach((d, i) => {
      const n = d.roles.length; const sel = i === di; const R = sel ? 150 : 46;
      d.roles.forEach((r, k) => {
        const a = (k / n) * Math.PI * 2 + i;
        const dx = Math.cos(a) * R, dy = Math.sin(a) * R * 0.8;
        const size = sel ? (k === ri ? 22 : 15) : 8;
        moons.push({ title: r[0], tint: sel && k === ri ? d.tint : 't-pearl', labeled: sel, labelStyle: Math.cos(a) < -0.2 ? 'left:auto;right:calc(100% + 6px)' : '', style: 'left:calc(' + pos[i][0].toFixed(2) + '% + ' + dx.toFixed(1) + 'px);top:calc(' + pos[i][1].toFixed(2) + '% + ' + dy.toFixed(1) + 'px);width:' + size + 'px;height:' + size + 'px;z-index:' + (sel ? 5 : 3) });
      });
    });
    const links = D[di].rel.map((j) => ({ x1: pos[di][0], y1: pos[di][1], x2: pos[j][0], y2: pos[j][1] }));
    const dom = D[di]; const role = dom.roles[ri];
    return {
      theme: theme, themeLabel: theme === 'dark' ? 'Light' : 'Dark',
      toggleTheme: () => this.setState({ theme: theme === 'dark' ? 'light' : 'dark' }),
      domains: D.map((d, i) => ({ name: d.name, tint: d.tint, count: d.roles.length, cls: i === di ? 'dbtn on' : 'dbtn', go: () => this.setState({ domain: i, role: 0 }) })),
      planets: planets, moons: moons, links: links,
      domName: dom.name, domTint: dom.tint,
      roles: dom.roles.map((r, k) => ({ title: r[0], tint: k === ri ? dom.tint : 't-pearl', cls: k === ri ? 'rbtn on' : 'rbtn', go: () => this.setState({ role: k }) })),
      roleTitle: role[0], roleSummary: role[1]
    };
  }
}
</script>
</body>
</html>
